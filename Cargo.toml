# Workspace Cargo du projet `edge` : un cœur (`core`) sans interface, et un binaire (`cli`) qui l'appelle.
[workspace]
resolver = "3"
members = ["crates/core", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# 1.85 : première version stable qui accepte l'édition 2024 (et minimum de clap, toml et ureq).
rust-version = "1.85"
publish = false

# Les versions sont déclarées ici une seule fois ; chaque crate écrit `nom.workspace = true`.
[workspace.dependencies]
edge-core = { path = "crates/core" }
anyhow = "1.0.104"
approx = "0.5.1"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
clap = { version = "4.6.7", features = ["derive"] }
csv = "1.4.0"
directories = "6.0.0"
minijinja = "2.24.0"
plotters = { version = "0.3.7", default-features = false, features = ["svg_backend", "line_series", "point_series"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ureq = "3.4.2"

# Règles de CLAUDE.md appliquées par le compilateur : pas d'`unsafe`, pas d'`unwrap()` hors des tests.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
