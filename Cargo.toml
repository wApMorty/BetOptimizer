# Workspace Cargo du projet `edge` : un cœur (`core`) sans interface, et un binaire (`cli`) qui l'appelle.
[workspace]
resolver = "3"
members = ["crates/core", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# 1.85 : première version stable qui accepte l'édition 2024 (et minimum de clap, toml et ureq).
rust-version = "1.85"
publish = false

# Les versions sont déclarées ici une seule fois ; chaque crate écrit `nom.workspace = true`.
[workspace.dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Règles de CLAUDE.md appliquées par le compilateur : pas d'`unsafe`, pas d'`unwrap()` hors des tests.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
