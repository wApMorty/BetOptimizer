# Workspace Cargo du projet `edge` : un cœur (`core`, application Web comprise, sans réseau) et un binaire (`cli`) qui l'appelle.
[workspace]
resolver = "3"
members = ["crates/core", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# 1.89 : minimum de `statrs` (lois statistiques). L'édition 2024 exige déjà 1.85 ; clap, toml et ureq aussi.
rust-version = "1.89"
publish = false

# Les versions sont déclarées ici une seule fois ; chaque crate écrit `nom.workspace = true`.
[workspace.dependencies]
edge-core = { path = "crates/core" }
anyhow = "1.0.104"
argmin = { version = "0.11.0", default-features = false }
argmin-math = { version = "0.5.1", default-features = false, features = ["primitives", "vec"] }
approx = "0.5.1"
# Lecture des tableurs de tennis-data.co.uk (.xlsx, et .xls avant 2013) : leurs seuls formats. Rust pur, licence MIT.
calamine = "0.36.1"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
clap = { version = "4.6.7", features = ["derive"] }
csv = "1.4.0"
directories = "6.0.0"
minijinja = "2.24.0"
plotters = { version = "0.3.7", default-features = false, features = ["svg_backend", "line_series", "point_series"] }
# Image PNG des recommandations du jour, jointe au message Discord : rendu d'un SVG écrit par nous. Rust pur, licence MIT ou
# Apache-2.0 ; seule la fonctionnalité `text` (polices embarquées, pas celles du système). Validé par Paul le 2026-10-20.
resvg = { version = "0.48.1", default-features = false, features = ["text"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
# Lecture des tableaux HTML de WePari (historique des cotes boostées), téléchargés une fois à la main : un vrai
# analyseur HTML plutôt que des expressions régulières fragiles. Sans le binaire de démonstration (`main`). Licence ISC.
# Validé par Paul le 2026-10-20.
scraper = { version = "0.27.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
statrs = "0.19.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
# Serveur HTTP synchrone de `edge serve` (site de rapports sur le réseau local) : threads standard, ni async ni tokio ;
# sans fonctionnalité par défaut, donc sans TLS. Licence MIT ou Apache-2.0. Validé par Paul le 2026-10-20.
tiny_http = { version = "0.12.0", default-features = false }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ureq = "3.4.2"

# Règles de CLAUDE.md appliquées par le compilateur : pas d'`unsafe`, pas d'`unwrap()` hors des tests.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
