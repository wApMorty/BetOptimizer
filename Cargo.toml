# Workspace Cargo du projet `edge` : un cœur (`core`) sans interface, un binaire (`cli`) et une application (`gui`) qui l'appellent.
[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "crates/gui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# 1.89 : minimum de `statrs` (lois statistiques). L'édition 2024 exige déjà 1.85 ; clap, toml et ureq aussi.
rust-version = "1.89"
publish = false

# Les versions sont déclarées ici une seule fois ; chaque crate écrit `nom.workspace = true`.
[workspace.dependencies]
edge-core = { path = "crates/core" }
anyhow = "1.0.104"
argmin = { version = "0.11.0", default-features = false }
argmin-math = { version = "0.5.1", default-features = false, features = ["primitives", "vec"] }
approx = "0.5.1"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
clap = { version = "4.6.7", features = ["derive"] }
csv = "1.4.0"
directories = "6.0.0"
# Application (phase 6). Paire compatible : egui_plot 0.37 attend egui 0.36, que fournit eframe 0.36 ; eframe 0.37 vise egui 0.37.
# wgpu : backend imposé par CLAUDE.md ; Wayland et X11 : la session de Paul est sous Wayland. Pas de glow ni d'accesskit.
eframe = { version = "0.36.2", default-features = false, features = ["wgpu", "wayland", "x11", "default_fonts"] }
egui_plot = "0.37.0"
minijinja = "2.24.0"
plotters = { version = "0.3.7", default-features = false, features = ["svg_backend", "line_series", "point_series"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
statrs = "0.19.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ureq = "3.4.2"

# Règles de CLAUDE.md appliquées par le compilateur : pas d'`unsafe`, pas d'`unwrap()` hors des tests.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
