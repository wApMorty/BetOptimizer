# d'OddsPapi (phase 13 : contrôle de qualité de `edge latency report`).
# Le nom canonique est celui de The Odds API quand il existe (c'est celui que verra le relevé en direct).
# Un nom absent de ce fichier BLOQUE l'import avec la liste des noms inconnus : aucun rapprochement approximatif.
# Ce fichier est versionné et embarqué dans le binaire : après modification, réinstaller `edge`.

