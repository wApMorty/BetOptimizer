# Configuration d'edge. `edge init` en dépose une copie dans le dossier de configuration de l'utilisateur
# (~/.config/edge/edge.toml sous Linux), avec les permissions 0600.
# Toute valeur omise prend la valeur par défaut indiquée ici. Une faute de frappe dans un nom de champ
# est refusée au chargement (une clé de bookmaker erronée serait facturée sans avertissement par l'API).

# Plafond de crédits The Odds API consommés par période de quota (le quota gratuit est de 500).
# Le client refuse tout appel qui ferait dépasser ce plafond.
monthly_credit_cap = 450

# Ligues archivées, au format des clés de The Odds API (GET /v4/sports).
leagues = [
    "soccer_epl",
    "soccer_spain_la_liga",
    "soccer_germany_bundesliga",
    "soccer_italy_serie_a",
    "soccer_france_ligue_one",
    "soccer_spl",
]

# Bookmakers interrogés. Jusqu'à 10 bookmakers comptent pour une seule région : 1 crédit par appel.
bookmakers = [
    "pinnacle",
    "winamax_fr",
    "betclic_fr",
    "unibet_fr",
    "pmu_fr",
    "netbet_fr",
]

# Bookmakers archivés (leurs cotes restent dans l'archive, sans coût supplémentaire) mais jamais recommandés,
# jamais montrés dans le bilan Discord, l'application ni les rapports. Liste vide : aucun opérateur écarté.
excluded_bookmakers = ["netbet_fr"]

# Marchés interrogés (chaque marché supplémentaire multiplie le coût d'un appel).
markets = ["h2h"]

# Tennis : The Odds API n'a qu'une clé par tournoi (Grands Chelems, 1000 et 500), présente pendant le tournoi seulement.
# Le relevé quotidien découvre les tournois en cours (appel gratuit à /sports) et archive chacun pour 1 crédit.
# Pour ne pas dépasser le budget pendant les semaines chargées, le nombre de tournois par relevé est plafonné.
tennis_archive = true
tennis_max_tournaments = 6

# NBA : saison d'octobre à juin. `edge nba snapshot` (timer du soir, vers 22 h UTC) archive les cotes de ces marchés
# (vainqueur, handicaps, totaux : 1 crédit chacun, Pinnacle seul les cote tous) et récupère les résultats (2 crédits tous les
# deux jours). Le tennis est refusé avant la NBA : `nba_reserve_credits` crédits lui sont réservés sur le plafond.
nba_archive = true
nba_markets = ["h2h", "spreads", "totals"]
nba_reserve_credits = 120

# Méthode de retrait de la marge des cotes : "multiplicative", "power" ou "shin".
# "power" a le log loss le plus bas sur 19 138 matchs Pinnacle (rapport `edge market report`) ; les trois
# méthodes sont presque équivalentes pour une marge de 2,6 % et diffèrent davantage pour les marges élevées.
margin_method = "power"

# Clé API. Ne jamais la mettre dans git. Si elle est écrite ici, le fichier doit être en permissions 0600.
# La variable d'environnement EDGE_ODDS_API_KEY a priorité sur cette valeur.
# odds_api_key = "..."

# OddsPapi (phase 13, `edge latency`) : historique des cotes à chaque changement de prix, gratuit. Même règle de secret ;
# la variable EDGE_ODDSPAPI_KEY a priorité. Le plafond porte sur les requêtes décomptées (250 par mois dans l'offre
# gratuite) : seule la liste des matchs l'est, 6 requêtes par passage hebdomadaire.
# oddspapi_api_key = "..."
oddspapi_monthly_cap = 200

# Mises. La bankroll courante part de initial_bankroll, ajoute les gains et retire les mises de TES paris enregistrés
# (`edge bet log`). Demi-Kelly (0,5) est le choix du projet depuis le 2026-10-20 : en Kelly complet, un avantage annoncé
# surestimé fait décroître la bankroll (docs/sources.md §27). Les rapports comparent ×1, ½ et ¼.
initial_bankroll = 1000.0
kelly_fraction = 0.5
# Mise minimale en euros : un pari plus petit n'est pas suggéré. Les mises sont arrondies au dixième inférieur.
min_stake = 1.0

# Webhook Discord pour les notifications. Secret (il porte le jeton du salon) : ne jamais le mettre dans git ;
# s'il est écrit ici, le fichier doit être en permissions 0600. La variable EDGE_DISCORD_WEBHOOK a priorité.
# discord_webhook_url = "https://discord.com/api/webhooks/..."

# Application Web (`edge serve`) : recommandations, saisie des paris, bankroll, bonus, Loto Foot, rapports.
# "127.0.0.1:8737" : visible de ce poste seulement ; "0.0.0.0:8737" : de tout le réseau local (le pare-feu doit laisser
# passer le port).
serve_bind = "127.0.0.1:8737"
# Secret demandé une fois par navigateur à la connexion. Obligatoire pour `edge serve`. 24 caractères au moins (lettres,
# chiffres, - et _) : `openssl rand -hex 24`. Secret : fichier en permissions 0600. La variable EDGE_SERVE_TOKEN a priorité.
# serve_token = "..."
# Adresse du site vue depuis un autre appareil, rappelée dans le message Discord (qui ne joint alors plus le rapport).
# site_url = "http://portable.local:8737/"

# Bonus de bienvenue (`edge bonus`, docs/bonus-bienvenue.md) : valeur supposée d'un euro de freebet converti par couverture.
# Elle sert au calcul d'un premier pari remboursé en freebet, dont le gain n'est garanti que si le freebet reçu est ensuite
# converti à cette valeur au moins. 0,53 : bas de la fourchette mesurée sur l'archive (0,53 à 0,56, meilleur match du jour).
bonus_freebet_value = 0.53

# Loto Foot (phase 14, `edge lotofoot`, docs/sources.md §37, §38, §41, §47, §49 et §51) : LF7 et LF8. Une alerte Discord à la sortie
# de chaque grille ; la séance se lance au guichet (bouton « Optimiser maintenant » de l'application, ou à la main).
# Budget mensuel initial (tickets d'un euro, de 20 à 400), tant qu'aucun budget n'a été saisi dans l'application. Le seuil
# τ en découle par l'abaque (§49) ; les grilles se partagent le budget du mois dans l'ordre de clôture (§51).
lotofoot_monthly_budget = 60
# Poids de la probabilité de gain dans la recherche des tickets (μ ; 10 retenu sur la frontière espérance/fréquence).
lotofoot_frequency_weight = 10.0
# Une grille qui ferme moins de 10 minutes après la séance est écartée (le temps de remplir et de valider au guichet).
lotofoot_min_minutes_before_close = 10
# Une cote Pinnacle de l'archive sert si elle a moins de 30 heures ; sinon la ligue est relevée de nouveau.
lotofoot_max_odds_age_hours = 30
# Ligues absentes de l'archive : 1 crédit chacune, 8 au plus par séance (sous la garde de budget mensuelle).
lotofoot_session_credits = 8
# Compétitions où chercher les rencontres des grilles (`/events`, gratuit), en plus de `leagues`. Laisser la liste par
# défaut sauf besoin : elle couvre les ligues vues dans les grilles de 2025-2026.
# lotofoot_leagues = ["soccer_france_ligue_two", "soccer_uefa_champs_league", ...]
# Points de vente où valider les grilles, horaires de la semaine à l'heure de Paris (un jour absent est fermé ; deux
# plages pour une coupure de midi). L'alerte « nouvelle grille » donne, pour chacun, le dernier moment pour valider.
# [[lotofoot_outlets]]
# name = "Tabac du centre"
# mar = ["07:00-12:30", "14:00-19:30"]
# sam = ["08:00-19:30"]
# dim = ["08:30-12:30"]

# Grand Loto (phase 16, `edge loto`, docs/sources.md §43 et §44) : le jackpot est toujours versé, au rang 1 ou aux rangs
# inférieurs. Une grille est jouée si ses euros rendus par euro misé atteignent grand_loto_threshold au nombre de grilles
# pessimiste (quantile grand_loto_quantile de la prévision). Budget d'une édition : 20 €, soit quatre grilles à 5 €.
grand_loto_budget = 20.0
grand_loto_threshold = 1.05
grand_loto_quantile = 0.8
# La séance a lieu au plus 3 jours avant l'édition (timer edge-loto du soir).
grand_loto_days_before = 3
# Éditions annoncées par la FDJ, à saisir à la main (l'archive ne contient pas les tirages à venir). Prix, codes gagnants
# et gain d'un code ont des valeurs par défaut (5 €, 100 codes de 20 000 €) ; les préciser s'ils changent.
# [[grand_loto_editions]]
# date = "2026-12-25"
# jackpot = 20000000
